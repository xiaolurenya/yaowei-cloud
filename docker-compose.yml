services:
  yaowei-cloud:
    image: ${DOCKERHUB_USER:-xiaoluya}/yaowei-cloud-suite:latest
    container_name: yaowei-cloud
    restart: unless-stopped
    ports:
      - "8899:80"
    environment:
      YAOWEI_LICENSE_ENDPOINT: "${YAOWEI_LICENSE_ENDPOINT:-}"
      YAOWEI_LICENSE_SKU: "yaowei-cloud-suite"
      YAOWEI_LICENSE_OFFLINE_GRACE_DAYS: "7"
